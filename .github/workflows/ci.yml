name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: notey
          POSTGRES_PASSWORD: notey_dev_only
          POSTGRES_DB: notey_test
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U notey -d notey_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '28.3.1'
          elixir-version: '1.19.5'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp28.3.1-elixir1.19.5-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: MIX_ENV=test mix compile --warnings-as-errors
      - name: Tests, coverage minimum and Coveralls.io
        run: mix coveralls.multiple --type html --type github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: cover/
          if-no-files-found: error
          retention-days: 7
      - run: mix assets.setup
      - run: mix assets.build
      - run: MIX_ENV=prod mix compile --warnings-as-errors
      - run: MIX_ENV=prod mix assets.deploy
      - run: MIX_ENV=prod mix release
